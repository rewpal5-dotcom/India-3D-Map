<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>India 3D Map</title>
<meta name="theme-color" content="#060a14">
<style>
  :root{ --ink:#e8f1ff; --muted:#8fa3bd; --line:rgba(255,255,255,.12); --accent:#38bdf8; --accent2:#a78bfa; }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:#060a14;color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;overflow:hidden;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #stage{position:fixed;inset:0}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  header{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;align-items:center;gap:10px;
    padding:10px 14px;background:linear-gradient(180deg,rgba(6,10,20,.92),rgba(6,10,20,0));
    pointer-events:none}
  header .logo{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-weight:900;font-size:14px;
    background:linear-gradient(140deg,var(--accent),var(--accent2));color:#04121f}
  header h1{margin:0;font-size:15px;letter-spacing:.4px;font-weight:800}
  header .sub{font-size:11px;color:var(--muted);margin-left:2px}
  .tools{margin-left:auto;display:flex;gap:8px;pointer-events:auto;flex:0 0 auto}
  @media (max-width:520px){
    header{padding:8px 10px;gap:8px}
    header h1{font-size:13px;letter-spacing:.2px}
    header .sub{display:none}
    .tool{padding:7px 10px;font-size:11px}
    header .logo{width:26px;height:26px;font-size:12px}
  }
  .tool{border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);
    font-size:12px;font-weight:700;padding:8px 12px;border-radius:11px;cursor:pointer;font-family:inherit}
  .tool.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#04121f;border-color:transparent}
  #panel{position:fixed;left:12px;right:12px;bottom:12px;z-index:6;border:1px solid var(--line);
    background:rgba(10,16,28,.86);backdrop-filter:blur(10px);border-radius:16px;padding:14px 16px;
    transform:translateY(130%);transition:transform .25s ease}
  #panel.on{transform:none}
  #panel h2{margin:0 0 2px;font-size:17px;letter-spacing:-.3px}
  #panel .meta{font-size:12px;color:var(--muted);margin:0 0 8px}
  #panel .row{display:flex;gap:8px;flex-wrap:wrap}
  #panel .pill{font-size:11px;font-weight:700;color:#9fe9f5;background:rgba(56,189,248,.12);
    border:1px solid rgba(56,189,248,.3);padding:5px 10px;border-radius:999px}
  #panel .close{position:absolute;top:10px;right:12px;background:none;border:0;color:var(--muted);font-size:18px;cursor:pointer}
  #hint{position:fixed;left:0;right:0;bottom:14px;text-align:center;font-size:11.5px;color:#5f7793;z-index:4;pointer-events:none}
  #hint.hide{display:none}
  #tip{position:fixed;z-index:7;pointer-events:none;padding:5px 9px;border-radius:8px;font-size:11.5px;font-weight:700;
    background:rgba(232,241,255,.94);color:#08131f;transform:translate(-50%,-140%);display:none;white-space:nowrap}
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>

<header>
  <div class="logo">IN</div>
  <div>
    <h1>India 3D Map</h1>
    <div class="sub">drag to rotate · pinch / scroll to zoom</div>
  </div>
  <div class="tools">
    <button class="tool on" id="rotBtn">⟳ Rotate</button>
    <button class="tool" id="walkBtn">🚶 Walk</button>
    <button class="tool" id="modeBtn">🗺 States</button>
    <button class="tool" id="resetBtn">Reset</button>
  </div>
</header>

<div id="tip"></div>
<div id="hint">State par tap karein — details yahan aayengi</div>

<div id="panel">
  <button class="close" id="panelClose">×</button>
  <h2 id="stName">—</h2>
  <p class="meta" id="stMeta">India</p>
  <div class="row">
    <span class="pill" id="pillArea">Area —</span>
    <span class="pill" id="pillCode">Code —</span>
  </div>
</div>

    var iw = relief.width, ih = relief.height;
    var scale = 1040 / iw;
    var w = iw * scale, h = ih * scale;
    var x0 = -w/2, x1 = w/2, z0 = -h/2, z1 = h/2;
    var y = 6;

    /* soft shadow under the slab */
    var c0 = project(0, 0, 0);
    var rad = 320 * c0.s * zoom;
    var grd = ctx.createRadialGradient(c0.x, c0.y + rad*0.22, rad*0.15, c0.x, c0.y + rad*0.22, rad);
    grd.addColorStop(0, "rgba(10,25,45,.55)");
    grd.addColorStop(1, "rgba(10,25,45,0)");
    ctx.save(); ctx.translate(c0.x, c0.y + rad*0.20); ctx.scale(1, 0.45);
    ctx.beginPath(); ctx.arc(0, 0, rad, 0, Math.PI*2); ctx.fillStyle = grd; ctx.fill();
    ctx.restore();


    /* the textured top */
    var pA = project(x0, y, z0), pB = project(x1, y, z0);
    var pC = project(x1, y, z1), pD = project(x0, y, z1);
    drawTexturedTriangle({x:0,y:0},{x:iw,y:0},{x:iw,y:ih}, pA,pB,pC);
    drawTexturedTriangle({x:0,y:0},{x:iw,y:ih},{x:0,y:ih}, pA,pC,pD);
  }

  /* ---------- projection ---------- */
  function project(x, y, z){
    var cy = Math.cos(yaw), sy = Math.sin(yaw);
    var x1 = x*cy - z*sy;
    var z1 = x*sy + z*cy;
    var cp = Math.cos(pitch), sp = Math.sin(pitch);
    var y1 = y*cp - z1*sp;
    var z2 = y*sp + z1*cp;
    var depth = z2 + camDist;
    if (depth < 40) depth = 40;
    var fit = Math.min(1.25, Math.max(0.5, Math.min(W, H) / 760));
    var s = (focal / depth) * zoom * fit;
    return { x: W/2 + x1*s, y: H/2 - y1*s + 40, s: s, d: depth };
  }

  /* ---------- render ---------- */
  var faces = [];
  var topPolys = [];

  function buildFaces(){
    faces.length = 0; topPolys.length = 0;
    for (var i=0;i<states.length;i++){
      var st = states[i];
      for (var r=0;r<st.rings.length;r++){
        var ring = st.rings[r];
        if (ring.length < 4) continue;

        /* top face */
        var top = [], sumd = 0;
        for (var j=0;j<ring.length;j++){
          var p = project(ring[j][0], height, ring[j][1]);
          top.push(p); sumd += p.d;
        }
        faces.push({ kind:"top", si:i, pts: top, depth: sumd/top.length });

        /* side walls */
        for (var k=0;k<ring.length-1;k++){
          var a = ring[k], b = ring[k+1];
          var p1 = project(a[0], height, a[1]);
          var p2 = project(b[0], height, b[1]);
          var p3 = project(b[0], 0, b[1]);
          var p4 = project(a[0], 0, a[1]);
          faces.push({ kind:"side", si:i, pts:[p1,p2,p3,p4], depth:(p1.d+p2.d+p3.d+p4.d)/4 });
        }
      }
    }
    faces.sort(function(a,b){ return b.depth - a.depth; });
  }

  function draw(){
    ctx.clearRect(0,0,W,H);

    /* background glow */
    if (mode === "relief"){
      var g2 = ctx.createRadialGradient(W*0.5, H*0.45, 40, W*0.5, H*0.45, Math.max(W,H)*0.85);
      g2.addColorStop(0, "#f4f8fc");
      g2.addColorStop(0.62, "#e7eef7");
      g2.addColorStop(1, "#d9e4f0");
      ctx.fillStyle = g2; ctx.fillRect(0,0,W,H);
      document.body.style.background = "#e7eef7";
      document.documentElement.style.setProperty("--ink", "#0d2136");
    } else {
      var g = ctx.createRadialGradient(W*0.5, H*0.42, 40, W*0.5, H*0.42, Math.max(W,H)*0.75);
      g.addColorStop(0, "rgba(56,189,248,.10)");
      g.addColorStop(0.55, "rgba(10,18,32,.55)");
      g.addColorStop(1, "#060a14");
      ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
      document.body.style.background = "#060a14";
      document.documentElement.style.setProperty("--ink", "#e8f1ff");
    }

    if (mode === "relief"){
      drawRelief();
      return;
    }

    buildFaces();

    for (var i=0;i<faces.length;i++){
      var f = faces[i];
      var st = states[f.si];
      var isSel = (selected === f.si);
      var isHov = (hovered === f.si);
      ctx.beginPath();
      ctx.moveTo(f.pts[0].x, f.pts[0].y);
      for (var j=1;j<f.pts.length;j++) ctx.lineTo(f.pts[j].x, f.pts[j].y);
      ctx.closePath();

      if (f.kind === "top"){
        ctx.fillStyle = isSel ? "#ffd166" : (isHov ? "#7dd3fc" : st.color);
        ctx.globalAlpha = isSel || isHov ? 1 : 0.94;
        ctx.fill();
        ctx.globalAlpha = 1;
        ctx.strokeStyle = "rgba(150,205,235,.30)";
        ctx.lineWidth = 0.7;
        ctx.stroke();
      } else {
        ctx.fillStyle = isSel ? "#8a6a1f" : (isHov ? "#1b4a63" : "rgba(16,40,66,.96)");
        ctx.fill();
      }
    }

    /* collect projected top polys for hit-testing (front to back) */
    topPolys.length = 0;
    for (var i2=faces.length-1;i2>=0;i2--){
      var f2 = faces[i2];
      if (f2.kind === "top") topPolys.push(f2);
    }
  }

  /* ---------- loop ---------- */
  var last = performance.now();
  function frame(t){
    var dt = Math.min(0.05, (t-last)/1000); last = t;
    if (autoRotate && !dragging) yaw += dt * 0.18;
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ---------- interaction ---------- */
  var dragging = false, lastX = 0, lastY = 0, pinch = null;

  function pointInPoly(px, py, pts){
    var inside = false;
    for (var i=0, j=pts.length-1; i<pts.length; j=i++){
      var xi = pts[i].x, yi = pts[i].y, xj = pts[j].x, yj = pts[j].y;
      if (((yi > py) !== (yj > py)) && (px < (xj-xi)*(py-yi)/(yj-yi)+xi)) inside = !inside;
    }
    return inside;
  }

  function pick(mx, my){
    if (mode !== "states") return null;
    for (var i=0;i<topPolys.length;i++){
      var f = topPolys[i];
      if (pointInPoly(mx, my, f.pts)) return f.si;
    }
    return null;
  }

  function onDown(x,y){ dragging = true; lastX = x; lastY = y; }
  function onMove(x,y){
    if (dragging){
      yaw += (x-lastX) * 0.008;
      pitch = Math.max(0.25, Math.min(1.45, pitch + (y-lastY) * 0.006));
      lastX = x; lastY = y;
    }
  }
  function onUp(){ dragging = false; }

  canvas.addEventListener("mousedown", function(e){ onDown(e.clientX, e.clientY); });
  window.addEventListener("mousemove", function(e){
    if (dragging) onMove(e.clientX, e.clientY);
    else {
      var idx = pick(e.clientX, e.clientY);
      hovered = idx;
      var tip = document.getElementById("tip");
      if (idx !== null){
        tip.style.display = "block";
        tip.style.left = e.clientX + "px";
        tip.style.top = e.clientY + "px";
        tip.textContent = states[idx].name;
        canvas.style.cursor = "pointer";
      } else { tip.style.display = "none"; canvas.style.cursor = "grab"; }
    }
  });
  window.addEventListener("mouseup", onUp);

  canvas.addEventListener("touchstart", function(e){
    if (e.touches.length === 1) onDown(e.touches[0].clientX, e.touches[0].clientY);
    else if (e.touches.length === 2){
      pinch = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
    }
  }, {passive:true});
  canvas.addEventListener("touchmove", function(e){
    if (e.touches.length === 1 && dragging) onMove(e.touches[0].clientX, e.touches[0].clientY);
    else if (e.touches.length === 2 && pinch){
      var d = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
      zoom = Math.max(0.6, Math.min(3.2, zoom * (d/pinch)));
      pinch = d;
    }
  }, {passive:true});
  canvas.addEventListener("touchend", function(){ onUp(); pinch = null; }, {passive:true});

  canvas.addEventListener("click", function(e){
    var idx = pick(e.clientX, e.clientY);
    if (idx === null) return;
    selected = idx;
    showPanel(idx);
  });

  canvas.addEventListener("wheel", function(e){
    e.preventDefault();
    zoom = Math.max(0.6, Math.min(3.2, zoom * (e.deltaY > 0 ? 0.92 : 1.08)));
  }, {passive:false});

  /* ---------- panel ---------- */
  function showPanel(idx){
    var st = states[idx];
    document.getElementById("stName").textContent = st.name;
    var bb = st.bbox;
    document.getElementById("stMeta").textContent = "India · " + (bb[2]-bb[0]).toFixed(1) + " × " + (bb[3]-bb[1]).toFixed(1) + " map units";
    document.getElementById("panel").classList.add("on");
    document.getElementById("hint").classList.add("hide");
  }
  document.getElementById("panelClose").addEventListener("click", function(){
    document.getElementById("panel").classList.remove("on");
    selected = null;
  });

  document.getElementById("rotBtn").addEventListener("click", function(){
    autoRotate = !autoRotate;
    this.classList.toggle("on", autoRotate);
  });
  document.getElementById("walkBtn").addEventListener("click", function(){ location.href = "./walk.html"; });

  document.getElementById("modeBtn").addEventListener("click", function(){
    mode = (mode === "relief") ? "states" : "relief";
    this.textContent = (mode === "relief") ? "🗺 States" : "🛰 Relief";
    this.classList.toggle("on", mode === "states");
    selected = null; hovered = null;
    document.getElementById("panel").classList.remove("on");
  });

  document.getElementById("resetBtn").addEventListener("click", function(){
    yaw = -0.22; pitch = 0.82; zoom = 1.12; selected = null;
    document.getElementById("panel").classList.remove("on");
  });
})();
</script>
</body>
</html>
